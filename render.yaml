# Render.com Blueprint — auto-detected settings for the KryptoX backend.
# Docs: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: kryptox-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      # Optional: set a CoinGecko demo key for higher rate limits
      # - key: COINGECKO_API_KEY
      #   value: your-api-key-here
