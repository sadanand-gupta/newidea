name: kryptox
description: KryptoX, a CoinGecko-style crypto market research app.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  animations: ^2.2.0
  cached_network_image: ^3.4.1
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.1
  http: ^1.6.0
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
